<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SpendWise{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header><div class="brand"><span class="logo">S</span> SpendWise</div><span class="tagline">Know where your money goes.</span></header>
<main class="container">{% with messages = get_flashed_messages(with_categories=true) %}{% for kind,msg in messages %}<div class="flash {{ kind }}">{{ msg }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main>
<footer>SpendWise · Python Capstone Project</footer></body></html>
