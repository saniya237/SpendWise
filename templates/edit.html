{% extends "base.html" %}{% block title %}Edit expense · SpendWise{% endblock %}{% block content %}
<section class="panel edit"><a class="reset" href="{{ url_for('index') }}">← Back to dashboard</a><h1>Edit expense</h1><form method="post" class="form">
<label>Date<input type="date" name="date" required value="{{ item.date }}"></label><label>Category<select name="category">{% for c in categories %}<option {% if item.category==c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></label>
<label>Amount (₹)<input type="number" name="amount" min="0.01" step="0.01" required value="{{ item.amount }}"></label><label>Description<input name="description" maxlength="250" value="{{ item.description }}"></label><button class="button">Save changes</button></form></section>{% endblock %}
